apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/wisphill/ops-infrastructure.git
      targetRevision: main
      ref: values
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 5.51.6
      helm:
        releaseName: argocd
        valueFiles:
          - $values/gitops/bootstrap/argocd/values.yaml
    - repoURL: https://github.com/wisphill/ops-infrastructure
      targetRevision: main
      path: gitops/bootstrap/argocd
      plugin:
        name: ksops

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
