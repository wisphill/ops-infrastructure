pilot:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi

meshConfig:
  enableTracing: true
  defaultProviders:
    tracing:
      - tempo
  extensionProviders:
    - name: tempo
      # send the traces data at the GRPC port 4317 of the tempo service
      opentelemetry:
        service: tempo.monitoring.svc.cluster.local
        port: 4317
