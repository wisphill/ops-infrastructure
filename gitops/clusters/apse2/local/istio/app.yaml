apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argocd

spec:
  project: default

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jqPathExpressions:
        - .webhooks[].failurePolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-default-validator
      jqPathExpressions:
        - .webhooks[].failurePolicy

  sources:
    - repoURL: https://github.com/wisphill/ops-infrastructure.git
      targetRevision: main
      ref: values
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.30.3

      helm:
        releaseName: istiod
        valueFiles:
          - $values/gitops/clusters/apse2/local/istio/values.yaml
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: 1.30.3
      helm:
        releaseName: istio-base

    - repoURL: https://github.com/wisphill/ops-infrastructure
      targetRevision: main
      path: gitops/clusters/apse2/local/istio
      plugin:
        name: ksops

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
