apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: http-test
  namespace: mesh-test
spec:
  hosts:
    - http-test

  http:
    - route:
        - destination:
            host: http-test
            subset: v1
          weight: 80

        - destination:
            host: http-test
            subset: v2
          weight: 20
