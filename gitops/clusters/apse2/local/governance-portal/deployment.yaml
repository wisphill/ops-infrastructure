apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata-governance-portal-backend
  namespace: governance-portal
  labels:
    app.kubernetes.io/name: openmetadata-governance-portal-backend
    app.kubernetes.io/part-of: openmetadata-governance-portal
spec:
  # The backend currently uses an in-memory session store; do not scale this
  # workload until sessions are moved to a shared store.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openmetadata-governance-portal-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmetadata-governance-portal-backend
        app.kubernetes.io/part-of: openmetadata-governance-portal
    spec:
      containers:
        - name: backend
          image: docker-registry.docker-registry.svc.cluster.local:5000/governance-portal/backend:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: openmetadata-governance-portal-backend-config
                  key: APP_ENV
            - name: BACKEND_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: openmetadata-governance-portal-backend-config
                  key: BACKEND_PUBLIC_URL
            - name: OIDC_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: openmetadata-governance-portal-backend-config
                  key: OIDC_REDIRECT_URI
            - name: SESSION_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: openmetadata-governance-portal-backend-config
                  key: SESSION_COOKIE_SECURE
          envFrom:
            - secretRef:
                name: openmetadata-governance-portal-backend-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
