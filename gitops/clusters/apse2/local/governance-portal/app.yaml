apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata-governance-portal-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wisphill/ops-infrastructure
    targetRevision: main
    path: gitops/clusters/apse2/local/governance-portal
  destination:
    server: https://kubernetes.default.svc
    namespace: governance-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
