apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oracle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wisphill/ops-infrastructure
    targetRevision: main
    path: gitops/clusters/apse2/local/oracle/manifests
    plugin:
      name: ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: oracle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
