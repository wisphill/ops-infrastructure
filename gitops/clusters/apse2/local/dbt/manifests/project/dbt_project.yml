name: shop_analytics
version: "1.0.0"
config-version: 2
profile: oracle_local

model-paths: ["models"]

models:
  shop_analytics:
    # Each `dbt run` refreshes the existing materialized views (DBMS_MVIEW.REFRESH), so the data
    # is fresh after each CronJob run (no Oracle-side refresh schedule needed).
    +materialized: materialized_view
