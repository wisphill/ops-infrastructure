apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argo-rollouts
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.40.6
      helm:
        releaseName: argo-rollouts

    - repoURL: https://github.com/wisphill/ops-infrastructure.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/wisphill/ops-infrastructure
      targetRevision: main
      path: gitops/clusters/apse2/local/argo-rollouts
      plugin:
        name: ksops

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
