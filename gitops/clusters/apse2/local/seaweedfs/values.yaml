master:
  enabled: true
  replicas: 1
  ingress:
    enabled: true
    className: nginx
    host: seaweedfs.opswork.io.vn
    path: /

volume:
  enabled: true
  replicas: 1
  dataDirs:
    - name: data
      type: "persistentVolumeClaim"
      size: "5Gi"
      maxVolumes: 0

filer:
  enabled: true
  replicas: 1

s3:
  enabled: true
  replicas: 1
