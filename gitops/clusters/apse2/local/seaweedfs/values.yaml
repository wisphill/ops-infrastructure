master:
  enabled: true
  replicas: 1
  ingress:
    enabled: true
    className: nginx
    host: seaweedfs.foolosophy.dev
    path: /

volume:
  enabled: true
  replicas: 1
  dataDirs:
    - name: data
      type: "persistentVolumeClaim"
      storageClass: "local-path-provisioner"
      size: "5Gi"
      maxVolumes: 0

filer:
  enabled: true
  replicas: 1
  ingresses:
    http:
      enabled: true
      className: nginx
      host: seaweedfs-filer.foolosophy.dev
      path: "/"

s3:
  enabled: true
  replicas: 1
  ingress:
    enabled: true
    className: nginx
    host: seaweedfs-s3.foolosophy.dev
    path: /

admin:
  enabled: true
  replicas: 1
  secret:
    adminUser: "admin"
    adminPassword: "admin"
  ingress:
    enabled: true
    className: nginx
    host: seaweedfs-admin.foolosophy.dev
    path: /
