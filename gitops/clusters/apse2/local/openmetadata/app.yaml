# OpenMetadata is split into three Argo CD Applications:
#   1. openmetadata-dependencies : MySQL + OpenSearch (sync-wave 0)
#   2. openmetadata              : the OpenMetadata server + UI (sync-wave 1)
#   3. openmetadata-ingestion    : metadata ingestion CronJobs (sync-wave 2)
#   4. openmetadata-auto-classification : C1-C4 tag suggestion CronJob (sync-wave 3)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata-dependencies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  sources:
    - repoURL: https://github.com/wisphill/ops-infrastructure.git
      targetRevision: main
      ref: values
    - repoURL: https://helm.open-metadata.org
      chart: openmetadata-dependencies
      targetRevision: 2.0.5
      helm:
        releaseName: openmetadata-dependencies
        valueFiles:
          - $values/gitops/clusters/apse2/local/openmetadata/dependencies-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  sources:
    - repoURL: https://github.com/wisphill/ops-infrastructure.git
      targetRevision: main
      ref: values
    # Encrypted secrets (mysql-secrets) rendered by ksops
    - repoURL: https://github.com/wisphill/ops-infrastructure
      targetRevision: main
      path: gitops/clusters/apse2/local/openmetadata/secrets
      plugin:
        name: ksops
    - repoURL: https://helm.open-metadata.org
      chart: openmetadata
      targetRevision: 2.0.5
      helm:
        releaseName: openmetadata
        valueFiles:
          - $values/gitops/clusters/apse2/local/openmetadata/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata-ingestion
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/wisphill/ops-infrastructure
    targetRevision: main
    path: gitops/clusters/apse2/local/openmetadata/ingestion
    plugin:
      name: ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Reads the openmetadata-ingestion-secrets Secret created by openmetadata-ingestion, hence wave 3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata-auto-classification
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/wisphill/ops-infrastructure
    targetRevision: main
    path: gitops/clusters/apse2/local/openmetadata/auto-classification
  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
