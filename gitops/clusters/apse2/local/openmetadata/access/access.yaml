# Declarative access for OpenMetadata bots, applied by sync_access.py (Job access-sync).
# Edit here and push: policies and roles are upserted (PUT), so UI edits to them are overwritten.
# Field names follow the OpenMetadata 2.0.5 CreatePolicyRequest / CreateRoleRequest API.
#
# Bots listed here are created if missing (JWT, no expiry). Bots only gain roles: a role the bot
# already has (or one assigned in the UI and not listed here) is never removed.
#
# Teams listed here are created if missing (teamType default Group) and kept in sync: defaultRoles
# is PATCHed to match this file (roles listed here are added, roles missing here are removed, same
# as EditAll on the team in the UI would do).
#
# Users listed here are created if missing (Google SSO; no password, must sign in with that exact
# Google account, whose domain also needs to be in values.yaml authorizer.allowedEmailRegistrationDomains).
# An existing user only gains the teams listed; teams added in the UI and not listed here are kept.
#
# Do not reuse names of built-in policies/roles (IngestionBotRole, AutoClassificationBotRole, ...):
# the PUT replaces their content.

policies:
  # Why: the CronJob files each suggested tag as a Suggestion task (POST /v1/tasks), which needs
  # Create on the task resource and CreateTask on the table, and keeps SuggestionTaskWorkflow in
  # sync with git. No built-in bot policy grants these.
  - name: DataSensitivityBotPolicy
    displayName: Data sensitivity bot
    description: >-
      Lets the auto-classification CronJob keep the DataSensitivity classification and the
      Suggestion workflow in sync with git and file Suggestion tasks for Data Stewards to confirm.
    rules:
      - name: AllowManageClassification
        description: sync_classifications.py upserts the DataSensitivity classification and tags.
        resources: [classification, tag]
        operations: [Create, EditAll, ViewAll]
        effect: allow
      - name: AllowManageSuggestionWorkflow
        description: sync_workflow.py upserts SuggestionTaskWorkflow.
        resources: [workflowDefinition]
        operations: [Create, EditAll, ViewAll]
        effect: allow
      - name: AllowCreateSuggestionTask
        description: run_auto_classification.py files Suggestion tasks and lists existing ones.
        resources: [task]
        operations: [Create, ViewAll]
        effect: allow
      - name: AllowCreateTask
        description: CreateTask on the table each Suggestion task is about.
        resources: [All]
        operations: [CreateTask]
        effect: allow

roles:
  - name: DataSensitivityBotRole
    displayName: Data sensitivity bot
    description: Permissions of data-sensitivity-bot (oracle-auto-classification CronJob).
    policies:
      - DefaultBotPolicy             # built in
      - AutoClassificationBotPolicy  # built in: read tables, sample data
      - DataSensitivityBotPolicy

  # Built in. An earlier version of this file reused this name and replaced its policies with a
  # custom one; listed here to restore the shipped content.
  - name: AutoClassificationBotRole
    displayName: Auto Classification bot role
    description: Role corresponding to a Auto Classification bot.
    policies: [AutoClassificationBotPolicy, DefaultBotPolicy]

bots:
  # Runs the oracle-auto-classification CronJob. Its JWT is OM_DATA_SENSITIVITY_BOT_TOKEN in
  # openmetadata-ingestion-secrets (see ../READme.md). ingestion-bot is not managed here.
  data-sensitivity-bot:
    displayName: Data sensitivity bot
    description: Suggests DataSensitivity (C1-C4) tags as Suggestion tasks.
    roles:
      - DataSensitivityBotRole

teams:
  # Not the SUGGESTION_ASSIGNEE_TEAM used by oracle-auto-classification (cronjob.yaml), which
  # stays DataSteward (the team name): this is a separate team, add members to it from the UI.
  vna-data-steward:
    teamType: Group
    displayName: VNA Data Steward
    description: Data Stewards for the VNA Oracle tables (app/analytics schemas).
    # DataSteward here is the built-in role (edit metadata, confirm tags/glossary terms), applied
    # to every member of this team. Re-synced on every run, so adding it in the UI instead would
    # be undone.
    defaultRoles:
      - DataSteward

users:
  # name is the email local-part: on Google SSO login OpenMetadata derives the username by
  # stripping everything from "@" on, so this must match or login creates a second, separate user.
  - name: phi.nguyen2
    email: phi.nguyen2@sotatek.com
    teams:
      - vna-data-steward
