# openmetadata chart values (local cluster)

replicaCount: 1

openmetadata:
  config:
    authorizer:
      # Admin = <initialAdmin>@<principalDomain>; must match the Google account email you sign in with.
      initialAdmins:
        - phi.pounce
      principalDomain: "gmail.com"
      # Only Google accounts on these domains may log in (accounts still have to exist: no self signup).
      allowedEmailRegistrationDomains:
        - gmail.com
        - sotatek.com
    elasticsearch:
      host: opensearch
      searchType: opensearch
      port: 9200
      scheme: http
    database:
      host: mysql
      port: 3306
      driverClass: com.mysql.cj.jdbc.Driver
      dbScheme: mysql
      databaseName: openmetadata_db
      auth:
        username: openmetadata_user
        password:
          # Provided by gitops/.../openmetadata/secrets (sops + ksops)
          secretRef: mysql-secrets
          secretKey: openmetadata-mysql-password
    authentication:
      # Only seeds the auth config on first boot. Once it is stored in the DB, changing this has no
      # effect; see READme.md in this directory for the manual step.
      enabled: true
      # Google SSO, confidential (server-side) OIDC flow. Client ID/secret come from Secret
      # oidc-secrets in ./secrets (sops + ksops). Google OAuth client (type Web application) needs the
      # authorized redirect URI https://openmetadata.foolosophy.dev/callback.
      provider: google
      clientType: confidential
      authority: "https://accounts.google.com"
      # Not a secret (visible to the browser), but must equal openmetadata-oidc-client-id in oidc-secrets.
      clientId: "504337467379-gq3st2cmidlilro2cssaje8cf39kqf2b.apps.googleusercontent.com"
      publicKeys:
        - "https://www.googleapis.com/oauth2/v3/certs"
        - "http://openmetadata:8585/api/v1/system/config/jwks"
      callbackUrl: "https://openmetadata.foolosophy.dev/callback"
      enableSelfSignup: false
      oidcConfiguration:
        enabled: true
        oidcType: "google"
        clientId:
          secretRef: oidc-secrets
          secretKey: openmetadata-oidc-client-id
        clientSecret:
          secretRef: oidc-secrets
          secretKey: openmetadata-oidc-client-secret
        discoveryUri: "https://accounts.google.com/.well-known/openid-configuration"
        callbackUrl: "https://openmetadata.foolosophy.dev/callback"
        serverUrl: "https://openmetadata.foolosophy.dev"
    # No Airflow in the local cluster, so don't try to reach a pipeline service.
    pipelineServiceClientConfig:
      enabled: false

image:
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: openmetadata.foolosophy.dev
      paths:
        - path: /
          pathType: Prefix
