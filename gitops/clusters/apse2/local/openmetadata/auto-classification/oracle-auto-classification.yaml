# OpenMetadata auto-classification workflow for the in-cluster Oracle database.
# Run by run_auto_classification.py; ${...} placeholders are expanded from the container env.
# Tables must already exist in OpenMetadata (oracle-metadata-ingestion CronJob).
source:
  type: oracle
  serviceName: oracle_local
  serviceConnection:
    config:
      type: Oracle
      hostPort: oracle.oracle.svc.cluster.local:1521
      username: OM_READER
      password: ${ORACLE_PASSWORD}
      oracleConnectionType:
        oracleServiceName: FREEPDB1
      databaseName: freepdb1
      # Empty = python-oracledb thin mode. The bundled 19c thick client is
      # rejected by Oracle 23ai logins (ORA-01017 with a correct password).
      instantClientDirectory: ""
  sourceConfig:
    config:
      type: AutoClassification
      enableAutoClassification: true
      # Rows are read for scoring only; sample data is not stored (VDP rule: no samples on raw
      # data or C3+ columns).
      storeSampleData: false
      sampleDataCount: 50
      # Workflow-wide floor (0-100); DataSensitivity.minimumConfidence (0.6) also applies.
      confidence: 60
      classificationLanguage: en
      schemaFilterPattern:
        includes:
          - "(?i)^app$"
          - "(?i)^analytics$"
# Must be tag-pii-processor: any other type falls back to the legacy PII-only processor and
# ignores the classification list given to run_auto_classification.py.
processor:
  type: tag-pii-processor
  config: {}
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata.openmetadata.svc.cluster.local:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT_TOKEN}
