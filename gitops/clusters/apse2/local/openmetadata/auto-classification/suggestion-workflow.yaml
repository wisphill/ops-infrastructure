# Lifecycle of every Suggestion task (OpenMetadata 2.0.5 CreateWorkflowDefinitionRequest), applied
# by sync_workflow.py on every auto-classification run: UI edits to this workflow are overwritten.
#
# Replaces the built-in SuggestionTaskWorkflow. The name must stay SuggestionTaskWorkflow: the
# server derives the task type from the workflow name, and any other name turns the review nodes
# into RequestApproval tasks that rewrite the payload.
#
# TaskStart -> ReviewerApprove -> Approved | Rejected. A single approval node whose assignees are
# the task reviewers; the bot that files the task chooses who they are, so one workflow serves
# both review stages:
#   * run_auto_classification.py files "C1-C4 Đề xuất" (proposal) tasks, reviewers: team
#     vna-data-steward.
#   * request_owner_review.py files the real "C1-C4" tasks, reviewers: the table owners.
# Admins review when a task has no reviewer. The tag is merged into the column on approve.
name: SuggestionTaskWorkflow
displayName: Suggestion Task Workflow
description: >-
  Gợi ý tự động (nhãn DataSensitivity): reviewer của task (Data Steward với nhãn "Đề xuất",
  Data Owner với nhãn C1-C4 chính thức) duyệt hoặc từ chối.
config:
  storeStageStatus: true
trigger:
  type: noOp
  config: {}
  output: [relatedEntity, updatedBy]
nodes:
  - type: startEvent
    subType: startEvent
    name: TaskStart
    displayName: Task Start

  - type: userTask
    subType: userApprovalTask
    name: ReviewerApprove
    displayName: Reviewer duyệt
    config:
      assignees:
        addReviewers: true
        addOwners: false
        candidates: []
        emptyAssigneeStrategy: assignAdmins
      approvalThreshold: 1
      rejectionThreshold: 1
      stageId: review
      stageDisplayName: Reviewer duyệt
      taskStatus: Open
      assigneeStrategy: reviewers
      transitionMetadata:
        - id: approve
          label: Duyệt
          targetStageId: approved
          targetTaskStatus: Approved
          resolutionType: Approved
          formRef: approve
          requiresComment: false
        - id: reject
          label: Từ chối
          targetStageId: rejected
          targetTaskStatus: Rejected
          resolutionType: Rejected
          formRef: reject
          requiresComment: true
    inputNamespaceMap:
      relatedEntity: global

  - type: endEvent
    subType: endEvent
    name: ApprovedEnd
    displayName: Approved

  - type: endEvent
    subType: endEvent
    name: RejectedEnd
    displayName: Rejected

edges:
  - {from: TaskStart, to: ReviewerApprove}
  - {from: ReviewerApprove, to: ApprovedEnd, condition: approve}
  - {from: ReviewerApprove, to: RejectedEnd, condition: reject}
