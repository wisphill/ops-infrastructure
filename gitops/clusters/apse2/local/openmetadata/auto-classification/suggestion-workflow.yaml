# Lifecycle of every Suggestion task (OpenMetadata 2.0.5 CreateWorkflowDefinitionRequest), applied
# by sync_workflow.py on every auto-classification run: UI edits to this workflow are overwritten.
#
# Replaces the built-in single-review SuggestionTaskWorkflow. The name must stay
# SuggestionTaskWorkflow: the server derives the task type from the workflow name, and any other
# name turns the review nodes into RequestApproval tasks that rewrite the payload.
#
#   1. run_auto_classification.py files the task (reviewers: team vna-data-steward).
#   2. StewardConfirm: a Data Steward confirms or rejects within 10 days. When the timer fires the
#      task closes as Expired and the next run files the suggestion again.
#   3. OwnerApprove: the table owners (admins if the table has none) approve or reject. The
#      suggested tag is merged into the column only on approve.
#
# Neither node uses status Open (see StewardConfirm.taskStatus), so tasks are acted on from the task
# page only.
#
# Only the final approve carries resolutionType Approved; "confirm" has none, so the task moves to
# the next node instead of closing. A level changed in the form at "confirm" is not kept (2.0.5
# only persists form edits on terminal transitions): the Steward proposes another level in a
# comment and the Owner sets it in the form when approving.
name: SuggestionTaskWorkflow
displayName: Suggestion Task Workflow
description: >-
  Gợi ý tự động (nhãn DataSensitivity, mô tả): Data Steward xác nhận trong 10 ngày, Data Owner
  duyệt. Quá hạn thì task đóng ở trạng thái Expired và bot gợi ý lại ở lần chạy sau.
config:
  storeStageStatus: true
trigger:
  type: noOp
  config: {}
  output: [relatedEntity, updatedBy]
nodes:
  - type: startEvent
    subType: startEvent
    name: TaskStart
    displayName: Task Start

  - type: userTask
    subType: userApprovalTask
    name: StewardConfirm
    displayName: Steward xác nhận
    config:
      assignees:
        addReviewers: true
        addOwners: false
        candidates:
          - team:vna-data-steward
        emptyAssigneeStrategy: assignAdmins
      approvalThreshold: 1
      rejectionThreshold: 1
      stageId: steward
      stageDisplayName: Steward xác nhận (10 ngày)
      # Not Open: the Activity Feed card (Approve/Reject) and the column suggestions panel only
      # act on Open tasks, and they resolve with resolutionType Approved, which the server treats
      # as the final approve at any node and merges the tag right away. Pending leaves only the
      # task page buttons, which send the transition (confirm/reject).
      taskStatus: Pending
      assigneeStrategy: reviewers
      transitionMetadata:
        - id: confirm
          label: Xác nhận
          targetStageId: owner
          targetTaskStatus: InProgress
          formRef: approve
          requiresComment: false
        - id: reject
          label: Từ chối
          targetStageId: rejected
          targetTaskStatus: Rejected
          resolutionType: Rejected
          formRef: reject
          requiresComment: true
      # The timer takes a variable name and wraps it as ${...}; a quoted literal is a constant.
      # Keep in sync with STEWARD_REVIEW_DAYS in run_auto_classification.py (task dueDate).
      expiryTimer:
        durationVariable: "'P10D'"
        transitionId: timeout
        closeAsResolution: Expired
    inputNamespaceMap:
      relatedEntity: global

  - type: userTask
    subType: userApprovalTask
    name: OwnerApprove
    displayName: Owner duyệt
    config:
      assignees:
        addReviewers: false
        addOwners: true
        candidates: 
          - admin
        emptyAssigneeStrategy: assignAdmins
      approvalThreshold: 1
      rejectionThreshold: 1
      stageId: owner
      stageDisplayName: Owner duyệt
      taskStatus: InProgress
      assigneeStrategy: owners
      transitionMetadata:
        - id: approve
          label: Duyệt
          targetStageId: approved
          targetTaskStatus: Approved
          resolutionType: Approved
          formRef: approve
          requiresComment: false
        - id: reject
          label: Từ chối
          targetStageId: rejected
          targetTaskStatus: Rejected
          resolutionType: Rejected
          formRef: reject
          requiresComment: true
    inputNamespaceMap:
      relatedEntity: global

  - type: endEvent
    subType: endEvent
    name: ApprovedEnd
    displayName: Approved

  - type: endEvent
    subType: endEvent
    name: RejectedEnd
    displayName: Rejected

  - type: endEvent
    subType: endEvent
    name: ExpiredEnd
    displayName: Expired

edges:
  - {from: TaskStart, to: StewardConfirm}
  - {from: StewardConfirm, to: OwnerApprove, condition: confirm}
  - {from: StewardConfirm, to: RejectedEnd, condition: reject}
  - {from: StewardConfirm, to: ExpiredEnd, condition: timeout}
  - {from: OwnerApprove, to: ApprovedEnd, condition: approve}
  - {from: OwnerApprove, to: RejectedEnd, condition: reject}
