# Second review stage of the DataSensitivity suggestions. oracle-auto-classification only files
# "C1-C4 Đề xuất" (proposal) tasks for the Data Steward team. Each run of this job takes every
# column that carries a proposal tag (a Steward approved it), files a Suggestion task for the real
# C1-C4 tag with the table owners as reviewers, and removes the proposal tag.
# See request_owner_review.py.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oracle-owner-review
  labels:
    app: oracle-owner-review
spec:
  # Every 5 min, two minutes after oracle-auto-classification (3-59/5).
  schedule: "5-59/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: oracle-owner-review
        spec:
          restartPolicy: Never
          containers:
            - name: owner-review
              image: openmetadata/ingestion-base:2.0.5
              imagePullPolicy: IfNotPresent
              command: ["python", "/config/request_owner_review.py", "/config/oracle-auto-classification.yaml"]
              env:
                # data-sensitivity-bot (../access/access.yaml), same as oracle-auto-classification.
                - name: OM_JWT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openmetadata-bot-secrets
                      key: OM_DATA_SENSITIVITY_BOT_TOKEN
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: oracle-auto-classification
