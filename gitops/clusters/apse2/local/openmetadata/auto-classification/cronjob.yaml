# Suggests a C1–C4 level (DataSensitivity classification) for each Oracle column. Each run:
#   1. sync_classifications.py applies auto-classification/data-sensitivity.yaml, so the
#      classification, tags and recognizers on the server always match git.
#   2. sync_workflow.py applies suggestion-workflow.yaml (Steward confirms in 10 days, then the
#      Owner approves) when it differs from the server copy.
#   3. run_auto_classification.py samples APP + ANALYTICS and files a Suggestion task per column
#      for the suggested DataSensitivity tag. Nothing is tagged until the Owner approves the task
#      in the UI (Tasks). Columns that already carry a DataSensitivity tag, or have a task for
#      that tag (open or rejected), are skipped; an expired task is filed again.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oracle-auto-classification
  labels:
    app: oracle-auto-classification
spec:
  # Every 5 min, one minute after oracle-metadata-ingestion (2-59/5) and before the next dbt-run
  # rebuild of ANALYTICS (*/5). A run still in progress makes the next one skip (Forbid).
  schedule: "3-59/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: oracle-auto-classification
        spec:
          restartPolicy: Never
          containers:
            - name: classify
              image: openmetadata/ingestion-base:2.0.5
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  python /config/sync_classifications.py /config/oracle-auto-classification.yaml /config/data-sensitivity.yaml
                  python /config/sync_workflow.py /config/oracle-auto-classification.yaml /config/suggestion-workflow.yaml
                  python /config/run_auto_classification.py /config/oracle-auto-classification.yaml DataSensitivity
              env:
                # Team that reviews the tasks (Steward step); admins if the team does not exist.
                # Team name (not displayName) from ../access/access.yaml teams.
                - name: SUGGESTION_ASSIGNEE_TEAM
                  value: vna-data-steward
                # Testing only: "true" files rejected suggestions again on the next run. Open
                # tasks still block, so no duplicates. Keep "false" outside tests.
                - name: SUGGESTION_RESUGGEST_REJECTED
                  value: "true"
                - name: ORACLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: openmetadata-ingestion-secrets
                      key: ORACLE_PASSWORD
                # data-sensitivity-bot (../access/access.yaml), not ingestion-bot.
                - name: OM_JWT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openmetadata-bot-secrets
                      key: OM_DATA_SENSITIVITY_BOT_TOKEN
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                # spaCy NER model is loaded in memory.
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
          volumes:
            - name: config
              configMap:
                name: oracle-auto-classification
