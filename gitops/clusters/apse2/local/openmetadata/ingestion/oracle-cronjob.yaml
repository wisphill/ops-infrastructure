# Airflow is disabled in this cluster, so the ingestion agent runs as a CronJob.
# Each run re-reads the full Oracle catalog and reconciles OpenMetadata
# (new/altered objects are upserted, dropped ones are soft-deleted).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oracle-metadata-ingestion
  labels:
    app: oracle-metadata-ingestion
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: oracle-metadata-ingestion
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: openmetadata/ingestion-base:2.0.5
              imagePullPolicy: IfNotPresent
              command: ["metadata", "ingest", "-c", "/config/oracle-metadata.yaml"]
              env:
                - name: ORACLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: openmetadata-ingestion-secrets
                      key: ORACLE_PASSWORD
                - name: OM_JWT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openmetadata-ingestion-secrets
                      key: OM_JWT_TOKEN
              volumeMounts:
                - name: workflow
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
          volumes:
            - name: workflow
              configMap:
                name: oracle-ingestion-workflow
