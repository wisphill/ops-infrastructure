# Airflow is disabled in this cluster, so the ingestion agent runs as a CronJob.
# Each run, in order:
#   1. The Oracle metadata workflow re-reads the catalog (APP + ANALYTICS) and reconciles
#      OpenMetadata (new/altered objects are upserted, dropped ones are soft-deleted).
#   2. The dbt workflow downloads the artifacts published by the dbt-run CronJob (namespace dbt)
#      and attaches models, descriptions and lineage to those tables.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oracle-metadata-ingestion
  labels:
    app: oracle-metadata-ingestion
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: oracle-metadata-ingestion
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: openmetadata/ingestion-base:2.0.5
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  metadata ingest -c /config/oracle-metadata.yaml
                  metadata ingest -c /config/dbt-metadata.yaml
              env:
                - name: ORACLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: openmetadata-ingestion-secrets
                      key: ORACLE_PASSWORD
                - name: OM_JWT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openmetadata-ingestion-secrets
                      key: OM_JWT_TOKEN
              volumeMounts:
                - name: workflow
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
          volumes:
            - name: workflow
              configMap:
                name: oracle-ingestion-workflow
