# OpenMetadata metadata-ingestion workflow for the in-cluster Oracle database.
# ${...} placeholders are expanded from the container env by the `metadata` CLI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-ingestion-workflow
data:
  oracle-metadata.yaml: |
    source:
      type: oracle
      serviceName: oracle_local
      serviceConnection:
        config:
          type: Oracle
          hostPort: oracle.oracle.svc.cluster.local:1521
          username: OM_READER
          password: ${ORACLE_PASSWORD}
          oracleConnectionType:
            oracleServiceName: FREEPDB1
          databaseName: freepdb1
          # Empty = python-oracledb thin mode. The bundled 19c thick client is
          # rejected by Oracle 23ai logins (ORA-01017 with a correct password).
          instantClientDirectory: ""
      sourceConfig:
        config:
          type: DatabaseMetadata
          includeTables: true
          includeViews: true
          includeStoredProcedures: true
          includeDDL: true
          # Propagate drops and source-side description changes to OpenMetadata.
          markDeletedTables: true
          markDeletedSchemas: true
          markDeletedStoredProcedures: true
          overrideMetadata: true
          schemaFilterPattern:
            includes:
              - "(?i)^app$"
              # Built by the dbt project in gitops/.../local/dbt; must be ingested before
              # dbt-metadata.yaml runs.
              - "(?i)^analytics$"
    sink:
      type: metadata-rest
      config: {}
    workflowConfig:
      loggerLevel: INFO
      openMetadataServerConfig:
        hostPort: http://openmetadata.openmetadata.svc.cluster.local:8585/api
        authProvider: openmetadata
        securityConfig:
          jwtToken: ${OM_JWT_TOKEN}

  # Attaches dbt models, descriptions and lineage (from manifest depends_on and compiled SQL)
  # to the tables the Oracle workflow above already created.
  dbt-metadata.yaml: |
    source:
      type: dbt
      serviceName: oracle_local
      sourceConfig:
        config:
          type: DBT
          # Published by the dbt-run CronJob in namespace dbt.
          dbtConfigSource:
            dbtConfigType: http
            dbtManifestHttpPath: http://dbt-artifacts.dbt.svc.cluster.local/manifest.json
            dbtCatalogHttpPath: http://dbt-artifacts.dbt.svc.cluster.local/catalog.json
          dbtUpdateDescriptions: true
          includeTags: true
    sink:
      type: metadata-rest
      config: {}
    workflowConfig:
      loggerLevel: INFO
      openMetadataServerConfig:
        hostPort: http://openmetadata.openmetadata.svc.cluster.local:8585/api
        authProvider: openmetadata
        securityConfig:
          jwtToken: ${OM_JWT_TOKEN}
