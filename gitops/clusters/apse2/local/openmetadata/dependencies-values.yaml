# openmetadata-dependencies chart values (local cluster)
# Service names are fixed (mysql / opensearch) because the openmetadata chart
# points at them by default.

mysql:
  enabled: true
  fullnameOverride: "mysql"
  architecture: standalone
  auth:
    rootPassword: password
  primary:
    extraFlags: "--sort_buffer_size=10M"
    persistence:
      size: 10Gi
    # The chart default exposes a nodePort on a ClusterIP service; keep it internal.
    service:
      type: ClusterIP
      nodePort: null
  # The openmetadata_user password must match gitops/.../openmetadata/secrets/secrets.enc.yaml
  initdbScripts:
    init_openmetadata_db_scripts.sql: |
      CREATE DATABASE openmetadata_db;
      CREATE USER 'openmetadata_user'@'%' IDENTIFIED BY 'openmetadata_password';
      GRANT ALL PRIVILEGES ON openmetadata_db.* TO 'openmetadata_user'@'%' WITH GRANT OPTION;
      commit;

opensearch:
  enabled: true
  clusterName: opensearch
  fullnameOverride: opensearch
  nodeGroup: ""
  imagePullPolicy: IfNotPresent
  opensearchJavaOpts: "-Xmx1g -Xms1g"
  persistence:
    size: 10Gi
  protocol: http
  config:
    opensearch.yml: |
      plugins.security.disabled: true
      indices.query.bool.max_clause_count: 4096
  singleNode: true
  resources:
    requests:
      cpu: "100m"
      memory: "1536M"
    limits:
      cpu: "2000m"
      memory: "2048M"

# Airflow (ingestion) is disabled for the local cluster: it needs RWX storage for
# DAGs and a lot of memory. Enable it later (or switch the pipeline client to
# argoWorkflows / k8s) if metadata ingestion pipelines are required.
airflow:
  enabled: false
