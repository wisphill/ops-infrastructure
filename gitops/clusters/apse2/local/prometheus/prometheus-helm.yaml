apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/wisphill/ops-infrastructure.git
      targetRevision: main
      ref: values
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 56.6.2
      helm:
        releaseName: monitoring
        # one prometheus instance is enough for most use cases.
        # disable the node exporter because I am using K8S on WSL, WSL does not share the mount events to containers
        valueFiles:
          - $values/gitops/clusters/apse2/local/prometheus/values.yaml
    - repoURL: https://github.com/wisphill/ops-infrastructure
      targetRevision: main
      path: gitops/clusters/apse2/local/prometheus
      plugin:
        name: ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # for big custom resources CRD like the Prometheus
