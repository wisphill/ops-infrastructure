apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: deploy-openmetadata-governance-portal-frontend
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: openmetadata-governance-portal-frontend
    app.kubernetes.io/part-of: openmetadata-governance-portal
spec:
  entrypoint: deploy
  serviceAccountName: workflow-runner
  arguments:
    parameters:
      - name: source-repository
        value: git@github.com:wisphill/om-governance-ui.git
      - name: source-revision
        value: main
      - name: pages-project
        value: openmetadata-governance-portal
      - name: pages-branch
        value: main
      # This becomes part of the browser bundle, so it must be a public HTTPS URL.
      - name: vite-api-url
        value: ""

  templates:
    - name: deploy
      volumes:
        - name: workspace
          emptyDir: {}
        - name: git-ssh
          secret:
            secretName: argo-workflows-git-ssh
            defaultMode: 256
      containerSet:
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: git-ssh
            mountPath: /etc/git-ssh
            readOnly: true
        containers:
          - name: clone
            image: alpine/git:v2.45.2
            env:
              - name: GIT_SSH_COMMAND
                value: >-
                  ssh -F /dev/null -i /etc/git-ssh/ssh-privatekey -o IdentitiesOnly=yes
                  -o UserKnownHostsFile=/etc/git-ssh/known_hosts -o StrictHostKeyChecking=yes
              - name: GIT_TERMINAL_PROMPT
                value: "0"
            command: [sh, -ec]
            args:
              - |
                git clone --depth 1 --branch '{{workflow.parameters.source-revision}}' \
                  '{{workflow.parameters.source-repository}}' /workspace/source

          - name: build
            image: node:22-alpine
            dependencies: [clone]
            workingDir: /workspace/source
            env:
              - name: VITE_API_URL
                value: '{{workflow.parameters.vite-api-url}}'
              - name: VITE_BRAND_NAME
                value: Vietnam Airlines | VDP Data Governance Portal
              - name: VITE_USE_MOCKS
                value: "false"
            command: [sh, -ec]
            args:
              - |
                npm ci
                npm run build

          - name: deploy
            image: node:22-alpine
            dependencies: [build]
            workingDir: /workspace/source/frontend
            env:
              - name: CLOUDFLARE_API_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: argo-workflows-secret-keys
                    key: CLOUDFLARE_API_TOKEN
              - name: CLOUDFLARE_ACCOUNT_ID
                valueFrom:
                  secretKeyRef:
                    name: argo-workflows-secret-keys
                    key: CLOUDFLARE_ACCOUNT_ID
            command: [sh, -ec]
            args:
              - |
                npx --yes wrangler@4 pages deploy dist \
                  --project-name '{{workflow.parameters.pages-project}}' \
                  --branch '{{workflow.parameters.pages-branch}}'
