apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: buildkit-git-image
  namespace: argo-workflows

spec:
  entrypoint: build
  serviceAccountName: workflow-runner

  templates:
    - name: build

      volumes:
        - name: workspace
          emptyDir: {}
        - name: buildkit-config
          configMap:
            name: buildkit-config
        - name: git-ssh
          secret:
            secretName: argo-workflows-git-ssh
            defaultMode: 256

      # use the container set to make sure workflow pods are in the same node
      containerSet:
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: buildkit-config
            mountPath: /etc/buildkit/buildkitd.toml
            subPath: buildkitd.toml
          - name: git-ssh
            mountPath: /etc/git-ssh
            readOnly: true
        containers:
          - name: clone
            image: alpine/git:v2.45.2
            env:
              - name: GIT_SSH_COMMAND
                value: >-
                  ssh -F /dev/null -i /etc/git-ssh/ssh-privatekey -o IdentitiesOnly=yes
                  -o UserKnownHostsFile=/etc/git-ssh/known_hosts -o StrictHostKeyChecking=yes
              - name: GIT_TERMINAL_PROMPT
                value: "0"
            command:
              - sh
              - -c
            args:
              - |
                set -ex
                git clone git@github.com:wisphill/apps.gin.git /workspace
                ls -lah /workspace

          # buildkit build, then push to docker registry
          - name: build
            image: moby/buildkit:v0.25.1-rootless
            dependencies:
              - clone
            command:
              - buildctl-daemonless.sh
            env:
              - name: BUILDKITD_FLAGS
                value: --oci-worker-no-process-sandbox --config=/etc/buildkit/buildkitd.toml
            args:
              - build
              - --frontend
              - dockerfile.v0
              - --local
              - context=/workspace
              - --local
              - dockerfile=/workspace
              - --output
              - type=image,name=docker-registry.docker-registry.svc.cluster.local:5000/apps/gin:latest,push=true
