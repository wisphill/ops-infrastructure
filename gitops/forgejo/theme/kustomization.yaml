apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

# The Forgejo Helm release mounts this ConfigMap by its fixed name, so the
# kustomize hash suffix must stay disabled.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: forgejo-custom-theme
    files:
      - github-modern.css
      - header.tmpl
      - home.tmpl
