# Chart 17.3.3 currently defaults to Forgejo 15.0.12. Explicitly use the
# current Forgejo release while retaining the chart's rootless-image defaults.
image:
  tag: 17.0.2

persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    # Git packs may be large; limit this Ingress without relaxing request-body
    # limits for unrelated workloads.
    nginx.ingress.kubernetes.io/proxy-body-size: 1g
    # Stream Git uploads to Forgejo instead of staging entire packs on the
    # ingress controller's temporary filesystem.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: forgejo.foolosophy.dev
      paths:
        - path: /
          pathType: Prefix
          port: http

# Custom theme from gitops/forgejo/theme, mounted under GITEA_CUSTOM
# (/data/gitea). Template changes are only picked up after a pod restart.
extraVolumes:
  - name: custom-theme-css
    configMap:
      name: forgejo-custom-theme
      items:
        - key: github-modern.css
          path: github-modern.css
        - key: github-repo.css
          path: github-repo.css
  - name: custom-theme-templates
    configMap:
      name: forgejo-custom-theme
      items:
        - key: header.tmpl
          path: custom/header.tmpl
        - key: home.tmpl
          path: home.tmpl

extraContainerVolumeMounts:
  - name: custom-theme-css
    mountPath: /data/gitea/public/assets/css
    readOnly: true
  - name: custom-theme-templates
    mountPath: /data/gitea/templates
    readOnly: true

gitea:
  admin:
    # The chart generates the initial password. Require the admin to replace
    # it on first login, without resetting it on later pod rollouts.
    passwordMode: initialOnlyRequireReset
  oauth:
    - name: Google
      provider: openidConnect
      existingSecret: forgejo-google-oidc
      autoDiscoverUrl: https://accounts.google.com/.well-known/openid-configuration
      # Only the specified Google identity can pass this authentication source.
      requiredClaimName: email
      requiredClaimValue: phi.pounce@gmail.com
  config:
    APP_NAME: Phil's Forge
    APP_SLOGAN: Code, infrastructure & data
    server:
      DOMAIN: forgejo.foolosophy.dev
      ROOT_URL: https://forgejo.foolosophy.dev/
      DISABLE_SSH: true
      START_SSH_SERVER: false
    service:
      DISABLE_REGISTRATION: true
    oauth2_client:
      # This creates an account only after the auth source validates the exact
      # Google email claim above; normal Forgejo registration remains disabled.
      ENABLE_AUTO_REGISTRATION: true
      USERNAME: email
      ACCOUNT_LINKING: disabled
      OPENID_CONNECT_SCOPES: email profile
