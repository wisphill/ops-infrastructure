# Chart 17.3.3 currently defaults to Forgejo 15.0.12. Explicitly use the
# current Forgejo release while retaining the chart's rootless-image defaults.
image:
  tag: 17.0.2

persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    # Git packs and LFS objects may be large; limit this Ingress without
    # relaxing request-body limits for unrelated workloads.
    nginx.ingress.kubernetes.io/proxy-body-size: 1g
    # Stream Git/LFS uploads to Forgejo instead of staging entire packs on the
    # ingress controller's temporary filesystem.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: forgejo.foolosophy.dev
      paths:
        - path: /
          pathType: Prefix
          port: http

gitea:
  config:
    server:
      DOMAIN: forgejo.foolosophy.dev
      ROOT_URL: https://forgejo.foolosophy.dev/
      DISABLE_SSH: true
      START_SSH_SERVER: false
      LFS_START_SERVER: true
    service:
      DISABLE_REGISTRATION: true
